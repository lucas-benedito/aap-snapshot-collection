---
- name: Extract artifact archive
  ansible.builtin.unarchive:
    src: "{{ artifact_dir }}/{{ artifact_filename }}"
    dest: "{{ artifact_dir }}"
    remote_src: "{{ _artifact_extract_remote_src | default(false) }}"

- name: Verify extracted artifact content checksums
  ansible.builtin.include_tasks: verify_content.yml

- name: Validate extracted artifact
  ansible.builtin.include_tasks: validate.yml

# include_vars has no remote_src equivalent - it always reads the file
# locally on the control node, so it can't be used once the artifact has
# been extracted on a remote containerized target host instead. Fall back
# to slurp + from_yaml in that case.
- name: Load artifact secrets (local)
  ansible.builtin.include_vars:
    file: "{{ artifact_dir }}/artifact/secrets.yml"
    name: artifact_secrets
  when: not (_artifact_extract_remote_src | default(false))

- name: Load artifact secrets (remote)
  when: _artifact_extract_remote_src | default(false)
  block:
    - name: Slurp artifact secrets file
      ansible.builtin.slurp:
        src: "{{ artifact_dir }}/artifact/secrets.yml"
      register: _artifact_secrets_slurp
      no_log: "{{ __artifact_no_log }}"

    - name: Set artifact secrets fact
      ansible.builtin.set_fact:
        artifact_secrets: "{{ _artifact_secrets_slurp.content | b64decode | from_yaml }}"
      no_log: "{{ __artifact_no_log }}"

- name: Load artifact manifest (local)
  ansible.builtin.include_vars:
    file: "{{ artifact_dir }}/artifact/manifest.yml"
    name: artifact_manifest
  when: not (_artifact_extract_remote_src | default(false))

- name: Load artifact manifest (remote)
  when: _artifact_extract_remote_src | default(false)
  block:
    - name: Slurp artifact manifest file
      ansible.builtin.slurp:
        src: "{{ artifact_dir }}/artifact/manifest.yml"
      register: _artifact_manifest_slurp

    - name: Set artifact manifest fact
      ansible.builtin.set_fact:
        artifact_manifest: "{{ _artifact_manifest_slurp.content | b64decode | from_yaml }}"
...
