---
bugfixes:
  - >-
    automationgateway OCP import - patch the example-resource-server secret
    with the source cluster's service keys (controller_resource_key,
    eda_resource_key, hub_resource_key) from the artifact. On OCP, the AAP
    operator reads the existing resource-server secret and reuses its values
    without regenerating service keys; if the secret retains the destination
    cluster's original keys while the gateway DB was restored with the source
    cluster's keys, EDA resource_sync fails with 401. Patching the secret
    with source keys ensures the gateway DB and component pods agree on the
    same service key after import.
